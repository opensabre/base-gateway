spring:
  # Gateway routes and API access policies are managed in Nacos by base-gateway-admin.
  # Keep the import optional so the application can still start with the checked-in
  # baseline when Nacos is unavailable, while subscribing to changes in production.
  config:
    import:
      - optional:nacos:opensabre-common.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:base-gateway.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${REGISTER_HOST:localhost}:${REGISTER_PORT:8848}
      config:
        server-addr: ${REGISTER_HOST:localhost}:${REGISTER_PORT:8848}
        file-extension: yml
        # spring-alibaba-nacos-config 2023.x passes this map directly to the
        # Nacos client; the deployed server is mounted below /nacos.
        config:
          contextPath: /nacos
  session:
    store-type: redis
    redis:
      namespace: ${SPRING_SESSION_REDIS_NAMESPACE:opensabre:gateway:session}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      #password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 300

knife4j:
  gateway:
    enabled: true
    # 指定服务发现的模式聚合微服务文档，并且是默认`default`分组
    strategy: discover
    discover:
      enabled: true
      # 指定版本号(OpenAPI3)
      version : openapi3
      # 需要排除的微服务(eg:网关服务)
      excluded-services:
        - base-gateway

management:
  endpoints:
    web:
      exposure:
        include: '*'
  tracing:
    sampling:
      probability: 1.0
    enabled: true
    propagation:
      type: w3c

logging:
  level:
    io.github.opensabre.gateway: debug
    org.springframework.cloud.gateway.route: info
  file:
    path: logs
  pattern:
    level: '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{parentId:-}]'

opensabre:
  gateway:
    client-ip:
      # Only these direct peers may supply X-Forwarded-For. Configure the deployment network explicitly.
      trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:127.0.0.1/32,::1/128}
