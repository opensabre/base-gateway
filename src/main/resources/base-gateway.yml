spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # 开启服务发现
          lower-case-service-id: true  # 服务ID小写
      default-filters:
        # 令牌中继
        - TokenRelay=
        # 代理路径，代理至服务后会去除第一个路径的内容
#        - StripPrefix=1
        - AddResponseHeader=X-Response-Default-Foo, Default-Bar
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY
            methods: GET,POST
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 2  #流速 每秒
            redis-rate-limiter.burstCapacity: 10   #令牌桶的容积
            rate-limiter: "#{@defaultRedisRateLimiter}"  #SPEL表达式去的对应的bean
            key-resolver: "#{@apiKeyResolver}" #SPEL表达式去的对应的bean

  security:
    oauth2:
      # 资源服务器配置
      resourceserver:
        jwt:
          # Jwt中claims的iss属性，也就是jwt的签发地址，即认证服务器的根路径
          # 资源服务器会进一步的配置，通过该地址获取公钥以解析jwt
          issuer-uri: http://www.opensabre.cloud:8000
      client:
        provider:
          # 认证提供者,自定义名称
          custom-issuer:
            # Token签发地址(认证服务地址)
            issuer-uri: http://www.opensabre.cloud:8000
            # 获取用户信息的地址，默认的/userinfo端点需要IdToken获取，为避免麻烦自定一个用户信息接口
            user-info-uri: ${spring.security.oauth2.client.provider.custom-issuer.issuer-uri}/userinfo
            user-name-attribute: name
        registration:
          test_client1-client:
            # oauth认证提供者配置，和上边配置的认证提供者关联起来
            provider: custom-issuer
            # 客户端名称，自定义
            client-name: 用户登陆
            # 客户端id，从认证服务申请的客户端id
            client-id: test_client1
            # 客户端秘钥
            client-secret: test_client1
            # 客户端认证方式
            client-authentication-method: client_secret_basic
            # 获取Token使用的授权流程
            authorization-grant-type: authorization_code
            # 回调地址，这里设置为Spring Security Client默认实现使用code换取token的接口，当前服务(gateway网关)的地址
            redirect-uri: http://www.opensabre.cloud:8443/login/oauth2/code/test_client1-client
            scope: read,openid,profile

#网关白名单，无需要签权path
opensabre:
  gateway:
    permit:
      paths: /v3/**,/webjars/**,/assets/**,/doc.html,/favicon.ico,/base-organization/**,/base-authorization/**
