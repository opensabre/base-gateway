spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true # 开启服务发现
              lower-case-service-id: true  # 服务ID小写
          default-filters:
            # 令牌中继
            - TokenRelay=
            # 代理路径，代理至服务后会去除第一个路径的内容
            # - StripPrefix=1
            - AddResponseHeader=X-Response-Default-Foo, Default-Bar
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY
                methods: GET,POST
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2  #流速 每秒
                redis-rate-limiter.burstCapacity: 10   #令牌桶的容积
                rate-limiter: "#{@defaultRedisRateLimiter}"  #SPEL表达式去的对应的bean
                key-resolver: "#{@apiKeyResolver}" #SPEL表达式去的对应的bean
          routes:
            # 独立网关控制面；外部稳定前缀 /api/gateway-admin，转发时移除两层服务前缀。
            - id: base-gateway-admin-api
              uri: lb://base-gateway-admin
              predicates:
                - Path=/api/gateway-admin/**
              filters:
                - StripPrefix=2
            # IQC APIs keep their external prefix; OpenAPI itself is rooted at /v3 and must remove it.
            - id: iqc-platform-docs
              uri: lb://iqc-platform
              predicates:
                - Path=/api/iqc/v3/api-docs/**
              filters:
                - StripPrefix=2
            - id: iqc-platform-api
              uri: lb://iqc-platform
              predicates:
                - Path=/api/iqc/**
            - id: base-authorization
              uri: lb://base-authorization
              predicates:
                # Knife4j owns /webjars/**; forwarding it to authorization turns static assets into JSON 404s.
                - Path=/oauth2/**,/login,/logout,/assets/**
            - id: base-authorization-api
              uri: lb://base-authorization
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=2

  security:
    oauth2:
      # 资源服务器配置
      resourceserver:
        jwt:
          # Jwt中claims的iss属性，也就是jwt的签发地址，即认证服务器的根路径
          # 资源服务器会进一步的配置，通过该地址获取公钥以解析jwt
          issuer-uri: http://www.opensabre.cloud:8000
      client:
        provider:
          # 认证提供者,自定义名称
          custom-issuer:
            # Token签发地址(认证服务地址)
            issuer-uri: http://www.opensabre.cloud:8000
            # 获取用户信息的地址，默认的/userinfo端点需要IdToken获取，为避免麻烦自定一个用户信息接口
            user-info-uri: ${spring.security.oauth2.client.provider.custom-issuer.issuer-uri}/userinfo
            user-name-attribute: name
        registration:
          base-gateway-client:
            # oauth认证提供者配置，和上边配置的认证提供者关联起来
            provider: custom-issuer
            # 客户端名称，自定义
            client-name: 用户登陆
            # 客户端id，从认证服务申请的客户端id
            client-id: ${GATEWAY_OAUTH_CLIENT_ID:base-gateway}
            # 客户端秘钥
            client-secret: ${GATEWAY_OAUTH_CLIENT_SECRET:base-gateway}
            # 客户端id提交方式basic
            client-authentication-method: client_secret_basic
            # 获取Token使用的授权流程
            authorization-grant-type: authorization_code
            # 回调地址，这里设置为Spring Security Client默认实现使用code换取token的接口，当前服务(gateway网关)的地址
            redirect-uri: ${GATEWAY_REDIRECT_URI:http://opensabre:8080/login/oauth2/code/base-gateway-client}
            scope:
              - read
              - openid
              - profile
          base-gateway-local:
            provider: custom-issuer
            client-name: 本地用户登陆
            client-id: ${GATEWAY_LOCAL_OAUTH_CLIENT_ID:base-gateway-local}
            client-secret: ${GATEWAY_LOCAL_OAUTH_CLIENT_SECRET:base-gateway-local}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: ${GATEWAY_LOCAL_REDIRECT_URI:http://localhost:3000/login/oauth2/code/base-gateway-local}
            scope:
              - read
              - openid
              - profile
          iqc-platform-local:
            provider: custom-issuer
            client-name: IQC 本地前端
            client-id: ${IQC_GATEWAY_LOCAL_OAUTH_CLIENT_ID:iqc-platform-local}
            client-secret: ${IQC_GATEWAY_LOCAL_OAUTH_CLIENT_SECRET:base-gateway-local}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: ${IQC_GATEWAY_LOCAL_REDIRECT_URI:http://localhost:3010/login/oauth2/code/iqc-platform-local}
            scope:
              - read
              - openid
              - profile

# 网关白名单，无需要签权path
opensabre:
  gateway:
    # 网关白名单，无需要签权path
    permit:
      paths: /v3/**,/webjars/**,/assets/**,/doc.html,/swagger-ui/**,/api/*/v3/api-docs/**,/favicon.ico,/oauth2/**
    # 是否开启 url 权限校验，默认不开启
    permission:
      enabled: false
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
