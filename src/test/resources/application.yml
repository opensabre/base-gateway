server:
  port: 8443

spring:
  application:
    name: base-gateway
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false

logging:
  level:
    org.springframework.web: info
    org.apache.ibatis: info
    java.sql.PreparedStatement: info
    java.sql.Statement: info
    Java.sql.Connection: info
  file:
    path: logs

management:
  endpoints:
    web:
      exposure:
        include: '*'
